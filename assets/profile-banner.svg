<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Gianluca Cioni — Software Engineer</title>
  <desc id="desc">Technical Solutions, Product Engineering, End-to-End Delivery. From discovery and low-level design through implementation, UAT, production and hypercare.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-opacity="0.34" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="358" rx="23" fill="none" stroke="#30363d"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="72" y="94" fill="#8b949e" font-size="18" font-weight="700" letter-spacing="2.6">SOFTWARE ENGINEER</text>
    <text x="72" y="151" fill="#f0f6fc" font-size="46" font-weight="700">Gianluca Cioni</text>
    <text x="72" y="194" fill="#c9d1d9" font-size="22" font-weight="500">Turning ambiguous business problems into working software.</text>
    <g transform="translate(72 245)">
      <rect x="0" y="0" width="190" height="38" rx="19" fill="#161b22" stroke="#30363d"/>
      <text x="95" y="25" fill="#c9d1d9" text-anchor="middle" font-size="14" font-weight="600">Technical Solutions</text>
      <rect x="202" y="0" width="186" height="38" rx="19" fill="#161b22" stroke="#30363d"/>
      <text x="295" y="25" fill="#c9d1d9" text-anchor="middle" font-size="14" font-weight="600">Product Engineering</text>
      <rect x="400" y="0" width="184" height="38" rx="19" fill="#161b22" stroke="#30363d"/>
      <text x="492" y="25" fill="#c9d1d9" text-anchor="middle" font-size="14" font-weight="600">End-to-End Delivery</text>
    </g>
  </g>
  <g transform="translate(744 72)" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="0" y="0" fill="#8b949e" font-size="14" font-weight="700" letter-spacing="1.8">DELIVERY PATH</text>
    <line x1="28" y1="48" x2="28" y2="228" stroke="#30363d" stroke-width="2"/>
    <g><circle cx="28" cy="48" r="7" fill="#58a6ff" filter="url(#glow)"/><text x="54" y="53" fill="#f0f6fc" font-size="17" font-weight="650">Discovery / Requirements</text></g>
    <g><circle cx="28" cy="93" r="7" fill="#58a6ff"/><text x="54" y="98" fill="#f0f6fc" font-size="17" font-weight="650">Technical Solution / LLD</text></g>
    <g><circle cx="28" cy="138" r="7" fill="#58a6ff"/><text x="54" y="143" fill="#f0f6fc" font-size="17" font-weight="650">Implementation</text></g>
    <g><circle cx="28" cy="183" r="7" fill="#58a6ff"/><text x="54" y="188" fill="#f0f6fc" font-size="17" font-weight="650">Testing / UAT</text></g>
    <g><circle cx="28" cy="228" r="7" fill="#58a6ff"/><text x="54" y="233" fill="#f0f6fc" font-size="17" font-weight="650">Production / Hypercare</text></g>
  </g>
</svg>